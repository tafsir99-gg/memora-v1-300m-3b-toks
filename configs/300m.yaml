model:
  d_model: 960
  n_layers: 24
  n_heads: 15
  d_ff: 3840
  vocab_size: 32768
  max_seq_len: 1024
  dropout: 0.0
  use_bias: false
  tie_embeddings: true
  norm_eps: 1.0e-5
  rope_base: 10000.0
  init_std: 0.02

training:
  optimizer: "adamw"
  lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_tokens: 131072000
  lr_schedule: "cosine"
  wsd_decay_tokens: 100000000
  max_tokens: 3000000000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  grad_clip: 1.0
  global_batch_tokens: 262144
  micro_batch_size: 16
  seq_len: 1024
  precision: "fp16"
  compile: false
  seed: 42

checkpoint:
  dir: "checkpoints/"
  save_interval_steps: 500
  keep_last_n: 3
  save_optimizer: true
  lightweight_interval_steps: 100

data:
  dataset_name: "fineweb-edu-sample"
  tokenizer_path: "tokenizer/"
  shard_dir: "data/shards/"
  val_ratio: 0.005
  num_workers: 4
  seed: 42

evaluation:
  val_interval_steps: 500
  val_tokens: 10000000
  sample_interval_steps: 1000
  sample_prompts:
    - "The meaning of life is"
    - "In a groundbreaking discovery, scientists"
    - "Once upon a time in a land far away"
  sample_temperature: 0.8
  sample_top_k: 50
  sample_max_tokens: 128

logging:
  log_interval_steps: 10
  log_dir: "runs/"
  format: "jsonl"

distributed:
  backend: "nccl"
  strategy: "ddp"
