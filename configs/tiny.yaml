model:
  d_model: 128
  n_layers: 4
  n_heads: 2           # head_dim = 64 (even, ok for RoPE)
  d_ff: 512
  vocab_size: 1024
  max_seq_len: 128
  dropout: 0.0
  use_bias: false
  tie_embeddings: true
  norm_eps: 1.0e-5
  rope_base: 10000.0
  init_std: 0.02

training:
  optimizer: "adamw"
  lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_tokens: 1000
  lr_schedule: "cosine"
  wsd_decay_tokens: 1000
  max_tokens: 10000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  grad_clip: 1.0
  # global_batch_tokens = 1024 = micro_batch_size(2) * seq_len(128) * grad_accum(4) * 1 GPU
  # grad_accum_steps(world_size=1) = 1024 / (2*128*1) = 4
  # grad_accum_steps(world_size=2) = 1024 / (2*128*2) = 2
  global_batch_tokens: 1024
  micro_batch_size: 2
  seq_len: 128
  precision: "fp32"
  compile: false
  seed: 42

checkpoint:
  dir: "checkpoints/"
  save_full_interval_minutes: 5
  save_lightweight_interval_minutes: 2
  hf_upload_interval_minutes: 10
  keep_full_n: 2
  keep_lightweight_n: 3
  keep_best: true

session:
  max_wall_clock_minutes: 10
  shutdown_grace_minutes: 1

data:
  dataset_name: "test-data"
  tokenizer_path: "tokenizer/"
  shard_dir: "data/shards/"
  val_ratio: 0.1
  num_workers: 0
  seed: 42

evaluation:
  val_interval_minutes: 5
  val_tokens: 1000
  sample_interval_minutes: 10
  sample_prompts:
    - "Test"
  sample_temperature: 0.8
  sample_top_k: 10
  sample_top_p: 1.0
  sample_max_tokens: 10

logging:
  log_interval_steps: 1
  log_dir: "runs/"
  format: "jsonl"

distributed:
  backend: "gloo"
  strategy: "ddp"
